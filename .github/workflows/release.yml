name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Check the tag matches the version
        run: |
          v="$(jq -r .version tui/package.json)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $v"; exit 1; }

      - name: Test
        run: |
          cd tui && bun install --frozen-lockfile && bun run typecheck && bun test

      - name: Build
        run: |
          scripts/build-release.sh arm64
          scripts/build-release.sh x64
          cd dist/release && shasum -a 256 *.tar.gz > checksums.txt && cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/release/*.tar.gz dist/release/checksums.txt install.sh
