[package]
name = "tf-backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tf-backend"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[profile.release]
strip = true
